<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Political Sports Cards</title>
<meta name="description" content="Political Sports Cards — site not currently available.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0d14;
    --ink:#eef1f7;
    --ink-dim:#9aa4b8;
    --gold:#22d3ee;
    --gold-bright:#8ff0ff;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
  }
  .mark{
    width:64px; height:64px; margin:0 auto 24px; border-radius:16px; display:block;
    border:1px solid rgba(34,211,238,0.25);
    box-shadow:0 20px 50px -25px rgba(0,0,0,0.65), 0 0 40px -12px rgba(34,211,238,0.35);
  }
  h1{
    font-family:'Bebas Neue',Impact,sans-serif; font-weight:400; letter-spacing:0.04em;
    font-size:clamp(22px,4vw,28px); margin:0 0 14px; color:var(--ink);
  }
  p{
    color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0; max-width:380px;
  }
</style>
</head>
<body>

  <div>
    <img class="mark" src="assets/psc-icon.jpg" alt="Political Sports Cards mark">
    <h1>Political Sports Cards</h1>
    <p>This site is not currently available.</p>
  </div>

</body>
